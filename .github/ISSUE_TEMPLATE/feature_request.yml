name: Feature request
description: Suggest a feature or improvement with a clear use case.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas still being explored can first be discussed in the [Idea Discussions Area](https://github.com/KKKKhazix/AIHOT/discussions/categories/ideas).
        This repository does not provide a complete operational source list, nor does it maintain dedicated scrapers for platforms like Weibo or Xiaohongshu; refer to [Sources Documentation](https://github.com/KKKKhazix/AIHOT/blob/main/docs/sources.md) to integrate external scraping results.
        Features specific only to your site can be built as modules in your own repository under `modules/`, see [Architecture Documentation](https://github.com/KKKKhazix/AIHOT/blob/main/docs/architecture.md#modules).
  - type: textarea
    id: problem
    attributes:
      label: Use case and problem encountered
      description: Who needs it under what circumstances? What is inconvenient right now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired improvement
      description: Describe the behavior or results you want to see; concrete examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Solutions already tried (optional)
      description: Why do existing configurations, scripts, or other solutions not meet requirements?
