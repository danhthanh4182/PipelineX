name: Bug report
description: Report a reproducible issue to help us locate and fix it.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Deployment and usage questions can first be asked in the [Q&A Area](https://github.com/KKKKhazix/AIHOT/discussions/categories/q-a).
        Security vulnerabilities should be reported via [Private Vulnerability Reporting](https://github.com/KKKKhazix/AIHOT/security/advisories/new).
        Please do NOT upload full .env files, API keys, admin passwords, cookies, or production database dumps.
  - type: input
    id: revision
    attributes:
      label: Code version
      description: Run `git rev-parse --short HEAD` in repository directory; if unsure, specify download or update date. For repositories created using "Use this template", commit hashes do not match upstream, so provide generation date or latest sync date.
      placeholder: Commit hash, or download / generate / sync date
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Runtime environment
      description: Specify OS, Docker or native deployment, and relevant versions; specify browser for frontend issues.
      placeholder: Ubuntu / macOS; Docker Compose / Node.js; reverse proxy details; whether relevant configs were modified.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Starting from which page, command, or action? Provide minimal steps to reproduce.
      placeholder: |
        1. Open...
        2. Execute...
        3. Issue occurs...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual results
      placeholder: Expected...; Actual...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots (optional)
      description: Only paste relevant snippets; remove keys, passwords, cookies, and personal information before submitting; you can submit even without logs.
